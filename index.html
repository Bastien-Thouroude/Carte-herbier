<style>
:root {
  --ink: #17262E; --ink-soft: #4F5F66; --paper: #F3F6F5; --panel: #FFFFFF; --line: #D5DEDC; --sea: #1F5E73;
  --red: #B23A48; --brown: #9C6B1E; --green: #3F8A4F; --cyan: #2A7F8F; --other: #7A868C;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --ink: #E3EAEC; --ink-soft: #A3B1B6; --paper: #142027; --panel: #1B2A32; --line: #2E3F47; --sea: #7FB7C9; }
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font: 15px/1.45 var(--sans); }
[hidden] { display: none !important; }

.app { display: flex; height: 100%; }
#map { height: 100%; flex: 1; min-width: 0; background: #2b4a57; }
.panel-ctl {
  font: 500 0.85rem var(--sans); color: #17262E; background: #fff; cursor: pointer;
  border: 2px solid rgba(0,0,0,.2); background-clip: padding-box; border-radius: 4px; padding: 5px 10px;
}
.panel-ctl:hover { background-color: #F3F6F5; }

aside { width: 350px; flex: none; transition: margin-left .25s ease; background: var(--paper); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.head { padding: 20px 20px 12px; }
h1 { font: 600 1.45rem/1.15 var(--serif); margin: 0 0 4px; letter-spacing: -0.01em; }
.status { color: var(--ink-soft); font-size: 0.87rem; margin: 0; }
.status.err { color: var(--red); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: 0.8rem; color: var(--ink-soft); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

.scroll { overflow-y: auto; padding: 0 20px 20px; flex: 1; }
.block { padding: 14px 0; border-top: 1px solid var(--line); }
.block h2 { font: 600 0.92rem var(--sans); margin: 0 0 8px; display: flex; justify-content: space-between; align-items: baseline; }
.linkbtn { font: 400 0.8rem var(--sans); color: var(--sea); background: none; border: 0; padding: 0; cursor: pointer; }

input[type=search], select, input[type=number] {
  width: 100%; font: inherit; color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px;
}
select:disabled { opacity: .55; }
.field { margin-bottom: 8px; }
.field label, .row2 label { font-size: 0.8rem; color: var(--ink-soft); display: block; margin-bottom: 2px; }
.field select.on { border-color: var(--sea); box-shadow: inset 3px 0 0 var(--sea); }
.facet { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); margin-bottom: 6px; }
.facet summary { list-style: none; cursor: pointer; padding: 7px 10px; display: flex; gap: 8px; align-items: baseline; }
.facet summary::-webkit-details-marker { display: none; }
.facet summary::after { content: "▾"; color: var(--ink-soft); font-size: 0.8rem; }
.facet[open] summary::after { content: "▴"; }
.facet .fl { font-weight: 500; font-size: 0.9rem; flex: none; }
.facet .fs { flex: 1; min-width: 0; color: var(--ink-soft); font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
.facet.on { border-color: var(--sea); }
.facet.on .fs { color: var(--sea); font-weight: 500; }
.fbody { padding: 0 10px 8px; }
.fbody .ff { padding: 5px 8px; font-size: 0.85rem; margin-bottom: 4px; }
.fopts { max-height: 230px; overflow-y: auto; }
.fopts label { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; font-size: 0.88rem; }
.fopts .sw { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.fopts .n { margin-left: auto; color: var(--ink-soft); font-variant-numeric: tabular-nums; font-size: 0.8rem; }
.fopts .it { font-family: var(--serif); font-style: italic; }
.factions { display: flex; gap: 12px; padding-top: 4px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.drop {
  margin-top: 6px; border: 1.5px dashed var(--line); border-radius: 10px; padding: 22px 16px; text-align: center; color: var(--ink-soft);
}
.drop strong { display: block; color: var(--ink); font-weight: 600; margin-bottom: 6px; }
body.dragging .drop, body.dragging #map { outline: 3px dashed var(--sea); outline-offset: -8px; }

.stations { list-style: none; margin: 0; padding: 0; }
.stations li button {
  width: 100%; text-align: left; font: inherit; color: inherit; background: none; border: 0;
  padding: 7px 6px; border-radius: 6px; cursor: pointer; display: flex; gap: 8px; align-items: baseline;
}
.stations li button:hover { background: var(--panel); }
.stations .nm { flex: 1; }
.sub { color: var(--ink-soft); font-size: 0.8rem; }
.stations .n { color: var(--ink-soft); font-size: 0.82rem; font-variant-numeric: tabular-nums; }

.foot { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; }
.btn { font: 500 0.85rem var(--sans); color: var(--sea); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
.btn.primary { background: var(--sea); color: #fff; border-color: var(--sea); }
.btn input { display: none; }
button:focus-visible, input:focus-visible, select:focus-visible, .btn:focus-within { outline: 2px solid var(--sea); outline-offset: 2px; }

/* Marqueurs */
.ring { border-radius: 50%; display: grid; place-items: center; box-shadow: 0 0 0 1.5px #fff, 0 1px 3px rgba(0,0,0,.35); }
.ring span { background: #fff; color: #17262E; border-radius: 50%; display: grid; place-items: center; font: 600 10.5px/1 var(--sans); font-variant-numeric: tabular-nums; }
.leaflet-div-icon.plain { background: none; border: 0; }

/* Popups */
.leaflet-popup-content { margin: 12px 14px; font: 13.5px/1.4 var(--sans); color: #17262E; }
.pp h3 { font: 600 1.05rem/1.2 var(--serif); margin: 0 0 2px; }
.pp .coord { color: #4F5F66; font-size: 0.8rem; margin-bottom: 8px; }
.pp ul { list-style: none; margin: 0; padding: 0; }
.pp li { padding: 7px 0 7px 14px; border-top: 1px solid #E3E9E8; position: relative; }
.pp li::before { content: ""; position: absolute; left: 0; top: 13px; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.pp .sp { display: flex; gap: 8px; align-items: flex-start; }
.pp .txt { flex: 1; min-width: 0; }
.pp .tx { font-family: var(--serif); }
.pp .tx i { font-style: italic; font-weight: 500; }
.pp .au { color: #4F5F66; }
.pp .meta { color: #4F5F66; font-size: 0.8rem; }
.pp .rem { font-size: 0.8rem; margin-top: 2px; }
.pp a { color: #1F5E73; font-size: 0.8rem; }
.hg { flex: none; font: 500 0.75rem/1 var(--mono); background: #E8EFEE; color: #17262E; border-radius: 4px; padding: 4px 6px; white-space: nowrap; }
.hg.hg-h { background: #F7A592; }
.hg.hbt { background: #E6E0DF; }
.hg small { font: 600 0.62rem var(--sans); color: #4F5F66; margin-right: 3px; letter-spacing: .04em; }
.thumbs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.th { padding: 0; border: 1px solid #D5DEDC; border-radius: 4px; background: #F3F6F5; cursor: zoom-in; width: 58px; height: 78px; overflow: hidden; }
.th img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* Visionneuse de planches */
#lb { position: fixed; inset: 0; z-index: 3000; background: rgba(8,16,20,.94); display: grid; grid-template-rows: auto 1fr auto; color: #E3EAEC; }
#lb .bar { display: flex; justify-content: space-between; align-items: center; padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px; gap: 10px; }
#lb .cap { font-size: 0.9rem; }
#lb .cap i { font-family: var(--serif); font-size: 1.05rem; }
#lb .stage { overflow: auto; display: grid; place-items: center; min-height: 0; }
#lb .stage img { max-width: 100%; max-height: 100%; cursor: zoom-in; display: block; }
#lb .stage.zoom { place-items: start; }
#lb .stage.zoom img { max-width: none; max-height: none; cursor: zoom-out; }
#lb .nav { display: flex; justify-content: center; gap: 10px; padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px)); }
#lb button { font: 500 0.9rem var(--sans); color: #E3EAEC; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); border-radius: 6px; padding: 7px 14px; cursor: pointer; }
#lb button:disabled { opacity: .35; cursor: default; }

body.collapsed aside { margin-left: -350px; visibility: hidden; transition: margin-left .25s ease, visibility 0s .25s; }
.toggle { display: none; }
@media (max-width: 760px) {
  .panel-ctl { display: none; }
  body.collapsed aside { margin-left: 0; visibility: visible; }
  aside {
    width: auto; margin-left: 0;
    position: fixed; z-index: 1000; left: 0; right: 0; bottom: 0; height: 75%;
    border-right: 0; border-top: 1px solid var(--line); border-radius: 14px 14px 0 0;
    transform: translateY(100%); transition: transform .25s ease; padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  aside.open { transform: none; }
  .toggle {
    display: block; position: fixed; z-index: 1001; left: 12px; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    font: 600 0.9rem var(--sans); background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 20px; padding: 9px 16px; box-shadow: 0 2px 8px rgba(0,0,0,.2);
  }
}
@media (prefers-reduced-motion: reduce) { aside { transition: none; } }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
/* ---------- Colonnes reconnues (insensible aux accents et à la casse) ---------- */
const FIELDS = {
  id:      ["species_id algaebase", "species_id", "algaebase id", "algaebase"],
  classe:  ["class", "classe"],
  ordre:   ["ordre", "order"],
  famille: ["famille", "family"],
  genre:   ["genre", "genus"],
  espece:  ["espece", "species"],
  auteurs: ["authorites", "autorites", "authorities", "auteurs", "authority"],
  date:    ["date"],
  date2:   ["date2"],
  pays:    ["pays", "country"],
  site:    ["site"],
  prof:    ["profondeur", "depth"],
  latDec:  ["lat_dec", "latitude_dec", "lat dec", "lat"],
  lonDec:  ["lon_dec", "long_dec", "longitude_dec", "lon dec", "long dec", "lon", "lng"],
  latRaw:  ["latitude"],
  lonRaw:  ["longitude"],
  recolte: ["recolte", "recolteur"],
  ident:   ["identification", "identificateur"],
  codeHG:  ["code hg", "code_hg", "codehg", "code", "code herbier"],
  rem:     ["remarques", "remarque"],
  codeH:   ["code h", "code_h"],
  planche: ["planche", "planches", "scan", "scans", "image", "photo"]
};
const TAX = [
  { k: "classe",  label: "Class" },
  { k: "ordre",   label: "Order" },
  { k: "famille", label: "Family" },
  { k: "genre",   label: "Genus" },
  { k: "espece",  label: "Species" }
];
const EMPTY = "__vide__";

const norm = s => String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim().replace(/\s+/g, " ");
const keyOf = s => norm(s).replace(/\s+/g, "");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = id => document.getElementById(id);

/* 43.1008, 43,1008, 43°06'02.93"N, 43°06.05'N ; S, W et O donnent un signe négatif */
function parseCoord(v) {
  const s = String(v ?? "").trim();
  if (!s) return null;
  if (/^-?\d+(?:[.,]\d+)?$/.test(s)) return parseFloat(s.replace(",", "."));
  const sign = /[SWO]/i.test(s) || s.startsWith("-") ? -1 : 1;
  let m = s.match(/(\d+)[^\d.,]+(\d+)[^\d.,]+(\d+(?:[.,]\d+)?)/);
  if (m) return sign * (+m[1] + +m[2] / 60 + parseFloat(m[3].replace(",", ".")) / 3600);
  m = s.match(/(\d+)[^\d.,]+(\d+(?:[.,]\d+)?)/);
  if (m) return sign * (+m[1] + parseFloat(m[2].replace(",", ".")) / 60);
  return null;
}

const GROUPS = {
  red:   { label: "Red algae",  hex: "#B23A48", re: /florideo|bangio|compsopogono|rhodo|stylonemato|porphyrid|rhodella/ },
  brown: { label: "Brown algae",  hex: "#9C6B1E", re: /phaeo/ },
  green: { label: "Green algae", hex: "#3F8A4F", re: /ulvo|chloro|trebouxio|bryopsid|prasino|zygnem|charo|pedino/ },
  cyan:  { label: "Cyanobacteria", hex: "#2A7F8F", re: /cyano/ },
  other: { label: "Other",       hex: "#7A868C", re: /.*/ }
};
const GORDER = { red: 0, brown: 1, green: 2, cyan: 3, other: 4 };
const groupOf = c => { const n = norm(c); for (const k in GROUPS) if (GROUPS[k].re.test(n)) return k; return "other"; };

function ringHtml(counts, total, size) {
  let acc = 0; const stops = [];
  for (const k of Object.keys(GORDER)) {
    if (!counts[k]) continue;
    const a = acc / total * 360, b = (acc += counts[k]) / total * 360;
    stops.push(`${GROUPS[k].hex} ${a}deg ${b}deg`);
  }
  const inner = Math.round(size * 0.6);
  return `<div class="ring" style="width:${size}px;height:${size}px;background:conic-gradient(${stops.join(",")})"><span style="width:${inner}px;height:${inner}px">${total}</span></div>`;
}

/* ---------- Carte ---------- */
const map = L.map("map", { zoomControl: false }).setView([42.9, 5.5], 7);

/* Show / hide the side panel */
const PanelControl = L.Control.extend({
  options: { position: "topleft" },
  onAdd() {
    const b = L.DomUtil.create("button", "panel-ctl");
    b.type = "button"; b.id = "panelCtl";
    b.setAttribute("aria-controls", "panel");
    L.DomEvent.disableClickPropagation(b);
    b.onclick = () => setCollapsed(!document.body.classList.contains("collapsed"));
    return b;
  }
});
new PanelControl().addTo(map);
L.control.zoom({ position: "topleft" }).addTo(map);
function setCollapsed(c) {
  document.body.classList.toggle("collapsed", c);
  const b = document.getElementById("panelCtl");
  b.textContent = c ? "☰ Show filters" : "‹ Hide panel";
  b.setAttribute("aria-expanded", String(!c));
  setTimeout(() => map.invalidateSize(), 280);
}
setCollapsed(false);
const bases = {
  "Satellite (Esri)": L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19, attribution: "Imagery © Esri" }),
  "Street map (OpenStreetMap)": L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }),
  "Bathymetry (EMODnet)": L.tileLayer.wms("https://ows.emodnet-bathymetry.eu/wms", { layers: "emodnet:mean_atlas_land", format: "image/png", attribution: "© EMODnet Bathymetry" })
};
bases["Satellite (Esri)"].addTo(map);
L.control.layers(bases, null, { position: "topright" }).addTo(map);
L.control.scale({ imperial: false }).addTo(map);

const cluster = L.markerClusterGroup({
  showCoverageOnHover: false, maxClusterRadius: 45, disableClusteringAtZoom: CONFIG.disableClusteringAtZoom,
  iconCreateFunction: c => {
    const counts = {}; let total = 0;
    c.getAllChildMarkers().forEach(m => { for (const k in m.options.counts) counts[k] = (counts[k] || 0) + m.options.counts[k]; total += m.options.total; });
    const size = Math.round(30 + Math.min(Math.sqrt(total) * 2, 20));
    return L.divIcon({ html: ringHtml(counts, total, size), className: "plain", iconSize: [size, size] });
  }
}).addTo(map);

/* ---------- État ---------- */
let rows = [], stations = [], markers = new Map();
let folderFiles = [];   // scans picked with the folder button: { key, url, name }
const FACETS = [...TAX, { k: "pays", label: "Country" }];
const state = { q: "", sel: {}, open: {}, find: {}, y0: null, y1: null };
FACETS.forEach(f => { state.sel[f.k] = new Set(); state.open[f.k] = false; state.find[f.k] = ""; });

function setStatus(msg, err) { const el = $("status"); el.textContent = msg; el.classList.toggle("err", !!err); }

/* ---------- Lecture du CSV (UTF-8, repli Windows-1252 pour les exports Excel) ---------- */
function parseFile(file, enc = "UTF-8") {
  setStatus("Reading " + file.name + "…");
  Papa.parse(file, {
    header: true, skipEmptyLines: "greedy", transformHeader: h => h.trim(), encoding: enc,
    complete: r => {
      const bad = (r.meta.fields || []).join("").includes("\uFFFD") || r.data.slice(0, 200).some(o => Object.values(o).join("").includes("\uFFFD"));
      if (bad && enc === "UTF-8") return parseFile(file, "windows-1252");
      ingest(r.data, r.meta.fields || [], file.name);
    },
    error: e => setStatus("Could not read the file: " + (e && e.message ? e.message : "unreadable file") + ".", true)
  });
}

function ingest(data, headers, fname) {
  const col = {}, nh = headers.map(norm);
  for (const f in FIELDS) { const i = nh.findIndex(h => FIELDS[f].includes(h)); if (i >= 0) col[f] = headers[i]; }
  const get = (r, f) => (col[f] ? String(r[col[f]] ?? "").trim() : "");

  let skipped = 0;
  rows = [];
  for (const r of data) {
    const lat = parseCoord(get(r, "latDec")) ?? parseCoord(get(r, "latRaw"));
    const lon = parseCoord(get(r, "lonDec")) ?? parseCoord(get(r, "lonRaw"));
    if (lat == null || lon == null || Math.abs(lat) > 90 || Math.abs(lon) > 180) {
      if (Object.values(r).some(v => String(v).trim())) skipped++;
      continue;
    }
    const o = {};
    for (const f in FIELDS) o[f] = get(r, f);
    o.lat = lat; o.lon = lon;
    o.group = groupOf(o.classe);
    const y = (o.date + " " + o.date2).match(/\b(1[89]\d{2}|20\d{2})\b/);
    o.year = y ? +y[1] : null;
    o.search = norm([o.genre, o.espece, o.famille, o.ordre, o.classe, o.site, o.pays, o.codeHG, o.codeH, o.recolte, o.ident, o.rem].join(" "));
    rows.push(o);
  }

  $("welcome").hidden = true;
  $("filters").hidden = false;
  FACETS.forEach(f => { state.sel[f.k].clear(); state.find[f.k] = ""; });
  state.q = ""; $("q").value = "";
  buildStaticFilters();
  buildFacets();
  render(true);

  const n = new Set(rows.map(r => r.lat.toFixed(5) + "," + r.lon.toFixed(5))).size;
  const missing = ["latDec", "latRaw"].some(f => col[f]) ? "" : " No latitude column recognised.";
  setStatus(`${fname ? fname + " : " : ""}${rows.length} specimens at ${n} stations` + (skipped ? `, ${skipped} rows without readable coordinates skipped` : "") + "." + missing, !rows.length);

  const present = [...new Set(rows.map(r => r.group))].sort((a, b) => GORDER[a] - GORDER[b]);
  $("legend").innerHTML = present.map(g => `<span><i style="background:${GROUPS[g].hex}"></i>${GROUPS[g].label}</span>`).join("");
}

/* ---------- Filtres (sélection multiple, en cascade pour la taxonomie) ---------- */
const valOf = (r, k) => (k === "espece" ? (r.espece ? [r.genre, r.espece].filter(Boolean).join(" ") : "") : r[k]) || EMPTY;
const passes = (r, k) => !state.sel[k].size || state.sel[k].has(valOf(r, k));

function facetHtml(f, i) {
  const k = f.k;
  const taxIdx = TAX.findIndex(t => t.k === k);
  const pool = taxIdx >= 0 ? rows.filter(r => TAX.slice(0, taxIdx).every(u => passes(r, u.k))) : rows;
  const counts = new Map();
  pool.forEach(r => { const v = valOf(r, k); counts.set(v, (counts.get(v) || 0) + 1); });
  for (const v of [...state.sel[k]]) if (!counts.has(v)) state.sel[k].delete(v);   // drop choices that are no longer possible
  const vals = [...counts.keys()].sort(k === "classe"
    ? (a, b) => GORDER[groupOf(a)] - GORDER[groupOf(b)] || a.localeCompare(b)
    : (a, b) => (a === EMPTY) - (b === EMPTY) || a.localeCompare(b));
  const sel = state.sel[k];
  const summary = sel.size ? [...sel].map(v => v === EMPTY ? "not specified" : v).join(", ") : `all (${vals.length})`;
  const italic = k === "genre" || k === "espece";
  const opts = vals.map(v => {
    const sw = k === "classe" && v !== EMPTY ? `<span class="sw" style="background:${GROUPS[groupOf(v)].hex}"></span>` : "";
    const txt = v === EMPTY ? `<span class="sub">(not specified)</span>` : `<span class="${italic ? "it" : ""}">${esc(v)}</span>`;
    return `<label data-s="${esc(norm(v))}"><input type="checkbox" data-k="${k}" value="${esc(v)}"${sel.has(v) ? " checked" : ""}>${sw}${txt}<span class="n">${counts.get(v)}</span></label>`;
  }).join("");
  return `<details class="facet${sel.size ? " on" : ""}" data-k="${k}"${state.open[k] ? " open" : ""}>
    <summary><span class="fl">${f.label}</span><span class="fs">${esc(summary)}</span></summary>
    <div class="fbody">
      ${vals.length > 8 ? `<input type="search" class="ff" data-k="${k}" placeholder="Filter the list…" value="${esc(state.find[k])}">` : ""}
      <div class="fopts">${opts || '<span class="sub">No values</span>'}</div>
      <div class="factions"><button class="linkbtn" data-act="all" data-k="${k}">select all</button><button class="linkbtn" data-act="none" data-k="${k}">clear</button></div>
    </div></details>`;
}

function applyFind(k) {
  const d = document.querySelector(`.facet[data-k="${k}"]`); if (!d) return;
  const q = norm(state.find[k]);
  d.querySelectorAll(".fopts label").forEach(l => l.hidden = !!q && !l.dataset.s.includes(q));
}

function buildFacets(focus) {
  $("tax").innerHTML = TAX.map(facetHtml).join("");
  $("paysFacet").innerHTML = facetHtml(FACETS[FACETS.length - 1]);
  FACETS.forEach(f => applyFind(f.k));
  if (focus) {
    const el = document.querySelector(`.facet[data-k="${focus.k}"] ${focus.sel}`);
    if (el) el.focus();
  }
}

function buildStaticFilters() {
  const ys = rows.map(r => r.year).filter(Boolean);
  $("y0").value = ys.length ? Math.min(...ys) : "";
  $("y1").value = ys.length ? Math.max(...ys) : "";
  state.y0 = state.y1 = null;
}

function visible(r) {
  for (const f of FACETS) if (!passes(r, f.k)) return false;
  if (state.y0 && (r.year == null || r.year < state.y0)) return false;
  if (state.y1 && (r.year == null || r.year > state.y1)) return false;
  if (state.q && !state.q.split(" ").every(w => r.search.includes(w))) return false;
  return true;
}

/* ---------- Affichage ---------- */
function render(fit) {
  const groups = new Map();
  rows.filter(visible).forEach(r => {
    const k = r.lat.toFixed(5) + "," + r.lon.toFixed(5);
    if (!groups.has(k)) groups.set(k, { key: k, lat: r.lat, lon: r.lon, site: r.site, pays: r.pays, latRaw: r.latRaw, lonRaw: r.lonRaw, rows: [] });
    groups.get(k).rows.push(r);
  });
  stations = [...groups.values()].sort((a, b) => (a.site || "").localeCompare(b.site || ""));

  map.closePopup();
  cluster.clearLayers();
  markers.clear();
  const list = stations.map(s => {
    const counts = {};
    s.rows.forEach(r => counts[r.group] = (counts[r.group] || 0) + 1);
    const total = s.rows.length, size = Math.round(22 + Math.min(Math.sqrt(total) * 3, 16));
    const m = L.marker([s.lat, s.lon], {
      icon: L.divIcon({ html: ringHtml(counts, total, size), className: "plain", iconSize: [size, size] }),
      counts, total, title: s.site || s.key
    }).bindPopup(() => popup(s), { maxWidth: 400, maxHeight: 380 });
    markers.set(s.key, m);
    return m;
  });
  cluster.addLayers(list);

  $("stations").innerHTML = stations.length
    ? stations.map(s => `<li><button data-k="${s.key}"><span class="nm">${esc(s.site || "Unnamed site")}<br><span class="sub">${esc(s.pays)}</span></span><span class="n">${s.rows.length}</span></button></li>`).join("")
    : `<li class="sub" style="padding:6px 0">No station matches the filters.</li>`;

  if (fit) fitAll();
}

/* Planches : liste de listes d'URL candidates (une liste par planche) */
function planchesFor(r) {
  const names = r.planche ? r.planche.split(/[;|]/).map(s => s.trim()).filter(Boolean) : (r.codeHG ? [r.codeHG] : []);
  const out = [];
  for (const n of names) {
    const hasExt = /\.[a-z0-9]{2,5}$/i.test(n);
    if (folderFiles.length) {
      const k = keyOf(hasExt ? n.replace(/\.[a-z0-9]{2,5}$/i, "") : n);
      folderFiles.filter(f => f.key === k || (f.key.startsWith(k) && /[_\-.(]/.test(f.key[k.length]))).forEach(f => out.push([f.url]));
    } else {
      out.push(hasExt ? [CONFIG.planchesDir + encodeURIComponent(n)] : CONFIG.extensions.map(e => CONFIG.planchesDir + encodeURIComponent(n) + e));
    }
  }
  return out;
}
window.nextSrc = img => {
  const l = JSON.parse(img.dataset.srcs), i = +img.dataset.i + 1;
  if (i < l.length) { img.dataset.i = i; img.src = l[i]; } else img.closest(".th").remove();
};

function popup(s) {
  const items = [...s.rows].sort((a, b) => GORDER[a.group] - GORDER[b.group] || (a.genre + a.espece).localeCompare(b.genre + b.espece));
  const coord = `${s.lat.toFixed(5)}, ${s.lon.toFixed(5)}` + (s.latRaw && !/^-?[\d.,]+$/.test(s.latRaw) ? ` (${esc(s.latRaw)} ${esc(s.lonRaw)})` : "");
  return `<div class="pp"><h3>${esc(s.site || "Unnamed site")}${s.pays ? ", " + esc(s.pays) : ""}</h3><div class="coord">${coord}</div><ul>` +
    items.map(r => {
      const name = [r.genre, r.espece].filter(Boolean).join(" ") || r.famille || r.ordre || r.classe || "Unidentified taxon";
      const meta = [
        r.date && (r.date + (r.date2 && r.date2 !== r.date ? " – " + r.date2 : "")),
        r.prof && (/\d$/.test(r.prof) ? r.prof + " m" : r.prof),
        r.recolte && "collected by " + r.recolte,
        r.ident && "identified by " + r.ident,
        r.codeH && "H code " + r.codeH
      ].filter(Boolean).map(esc).join(", ");
      const ab = /^\d+$/.test(r.id) ? ` <a href="https://www.algaebase.org/search/species/detail/?species_id=${r.id}" target="_blank" rel="noopener">AlgaeBase</a>` : "";
      const herb = /^HBT/i.test(r.codeHG) ? "hbt" : /^HG/i.test(r.codeHG) ? "hg-h" : "";
      const hg = r.codeHG ? `<span class="hg ${herb}" title="${herb === "hbt" ? "HBT herbarium sheet" : "HG herbarium sheet"}">${esc(r.codeHG)}</span>` : "";
      const cap = esc(`<i>${esc(name)}</i> ${esc(r.auteurs)}<br>${r.codeHG ? esc(r.codeHG) + ", " : ""}${esc(s.site)}${r.date ? ", " + esc(r.date) : ""}`);
      const th = planchesFor(r).map(l =>
        `<button class="th" data-cap="${cap}"><img loading="lazy" src="${esc(l[0])}" data-srcs="${esc(JSON.stringify(l))}" data-i="0" onerror="nextSrc(this)" alt="Herbarium sheet ${esc(r.codeHG)}"></button>`).join("");
      return `<li style="--c:${GROUPS[r.group].hex}"><div class="sp"><div class="txt"><div class="tx"><i>${esc(name)}</i> <span class="au">${esc(r.auteurs)}</span></div>` +
        (meta ? `<div class="meta">${meta}</div>` : "") + (r.rem ? `<div class="rem">${esc(r.rem)}</div>` : "") + ab +
        `</div>${hg}</div>${th ? `<div class="thumbs">${th}</div>` : ""}</li>`;
    }).join("") + `</ul></div>`;
}

function fitAll() {
  if (!stations.length) return;
  map.fitBounds(L.latLngBounds(stations.map(s => [s.lat, s.lon])).pad(0.15), { maxZoom: 14 });
}

/* ---------- Visionneuse ---------- */
let lbList = [], lbIdx = 0;
function lbShow() {
  const t = lbList[lbIdx];
  $("lbStage").classList.remove("zoom");
  $("lbImg").src = t.src;
  $("lbCap").innerHTML = t.cap + (lbList.length > 1 ? ` <span class="sub">(${lbIdx + 1}/${lbList.length})</span>` : "");
  $("lbPrev").disabled = lbIdx === 0;
  $("lbNext").disabled = lbIdx === lbList.length - 1;
}
document.addEventListener("click", e => {
  const b = e.target.closest(".th"); if (!b) return;
  const all = [...b.closest(".pp").querySelectorAll(".th")];
  lbList = all.map(x => ({ src: x.querySelector("img").currentSrc || x.querySelector("img").src, cap: x.dataset.cap }));
  lbIdx = all.indexOf(b);
  $("lb").hidden = false; lbShow(); $("lbClose").focus();
});
$("lbClose").onclick = () => { $("lb").hidden = true; };
$("lbPrev").onclick = () => { if (lbIdx > 0) { lbIdx--; lbShow(); } };
$("lbNext").onclick = () => { if (lbIdx < lbList.length - 1) { lbIdx++; lbShow(); } };
$("lbImg").onclick = e => {
  const st = $("lbStage"), zoomed = st.classList.toggle("zoom");
  if (zoomed) { const r = e.target.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
    requestAnimationFrame(() => { st.scrollLeft = fx * st.scrollWidth - st.clientWidth / 2; st.scrollTop = fy * st.scrollHeight - st.clientHeight / 2; }); }
};
document.addEventListener("keydown", e => {
  if ($("lb").hidden) return;
  if (e.key === "Escape") $("lb").hidden = true;
  if (e.key === "ArrowLeft") $("lbPrev").click();
  if (e.key === "ArrowRight") $("lbNext").click();
});

/* ---------- Interactions ---------- */
let qt;
$("q").addEventListener("input", e => { clearTimeout(qt); qt = setTimeout(() => { state.q = norm(e.target.value); render(); }, 150); });
const filtersEl = $("filters");
filtersEl.addEventListener("change", e => {
  const cb = e.target.closest('input[type=checkbox][data-k]'); if (!cb) return;
  const k = cb.dataset.k;
  cb.checked ? state.sel[k].add(cb.value) : state.sel[k].delete(cb.value);
  buildFacets({ k, sel: `input[type=checkbox][value="${CSS.escape(cb.value)}"]` });
  render(true);
});
filtersEl.addEventListener("click", e => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const k = b.dataset.k;
  if (b.dataset.act === "none") state.sel[k].clear();
  else document.querySelectorAll(`.facet[data-k="${k}"] .fopts label:not([hidden]) input`).forEach(i => state.sel[k].add(i.value));
  buildFacets(); render(true);
});
filtersEl.addEventListener("input", e => {
  const f = e.target.closest(".ff"); if (!f) return;
  state.find[f.dataset.k] = f.value; applyFind(f.dataset.k);
});
filtersEl.addEventListener("toggle", e => {
  const d = e.target.closest(".facet"); if (d) state.open[d.dataset.k] = d.open;
}, true);
$("resetTax").onclick = () => { FACETS.forEach(f => { state.sel[f.k].clear(); state.find[f.k] = ""; }); buildFacets(); render(true); };
$("y0").onchange = e => { state.y0 = +e.target.value || null; render(); };
$("y1").onchange = e => { state.y1 = +e.target.value || null; render(); };
$("fit").onclick = fitAll;
$("stations").addEventListener("click", e => {
  const b = e.target.closest("button[data-k]"); if (!b) return;
  const m = markers.get(b.dataset.k);
  cluster.zoomToShowLayer(m, () => m.openPopup());
  if (matchMedia("(max-width: 760px)").matches) togglePanel(false);
});
document.querySelectorAll(".csvInput").forEach(inp => inp.onchange = e => { if (e.target.files[0]) parseFile(e.target.files[0]); e.target.value = ""; });

$("dir").onchange = e => {
  folderFiles.forEach(f => URL.revokeObjectURL(f.url));
  const files = [...e.target.files];
  const ok = files.filter(f => /\.(jpe?g|png|webp|gif)$/i.test(f.name));
  const tif = files.filter(f => /\.tiff?$/i.test(f.name)).length;
  folderFiles = ok.map(f => ({ name: f.name, key: keyOf(f.name.replace(/\.[^.]+$/, "")), url: URL.createObjectURL(f) }));
  $("dirLabel").textContent = `${folderFiles.length} sheets`;
  if (tif) setStatus(`${tif} TIFF files skipped: browsers cannot display them, please convert them to JPEG.`, true);
  map.closePopup();
};

["dragenter", "dragover"].forEach(t => document.addEventListener(t, e => { e.preventDefault(); document.body.classList.add("dragging"); }));
["dragleave", "drop"].forEach(t => document.addEventListener(t, e => { e.preventDefault(); if (t === "drop" || !e.relatedTarget) document.body.classList.remove("dragging"); }));
document.addEventListener("drop", e => {
  const f = [...(e.dataTransfer?.files || [])].find(f => /\.csv$/i.test(f.name) || f.type === "text/csv");
  if (f) parseFile(f); else if (e.dataTransfer?.files?.length) setStatus("Please drop a .csv file.", true);
});

function togglePanel(open) {
  $("panel").classList.toggle("open", open);
  $("toggle").setAttribute("aria-expanded", open);
  $("toggle").textContent = open ? "Show map" : "Filters and stations";
}
$("toggle").onclick = () => togglePanel(!$("panel").classList.contains("open"));

/* ---------- Chargement automatique : donnees.csv (en ligne), sinon données intégrées ---------- */
function parseText(txt, name) {
  const r = Papa.parse(txt.trim(), { header: true, skipEmptyLines: "greedy", transformHeader: h => h.trim() });
  ingest(r.data, r.meta.fields || [], name);
}
(async function autoload() {
  document.title = CONFIG.title;
  document.querySelector("h1").textContent = CONFIG.title;
  if (location.protocol.startsWith("http")) {
    try {
      const res = await fetch(CONFIG.dataFile, { cache: "no-store" });
      if (res.ok) { const t = await res.text(); if (t.trim()) return parseText(t, ""); }
    } catch (e) { /* no online file: fall back to embedded data */ }
  }
  const emb = document.getElementById("embedded-data");
  if (emb && emb.textContent.trim()) parseText(emb.textContent, "");
})();
</script>
</body>
</html>
